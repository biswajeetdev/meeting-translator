<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Teleprompter</title>
<style>
  :root {
    --bg: #07080a;
    --fg: #f4f5f7;
    --dim: #71767e;
    --accent: #6ee7b7;
    --warn: #fbbf24;
    --size: 34px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 var(--size)/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--dim);
    border-bottom: 1px solid #191b1f;
    background: #0b0c0f;
    -webkit-user-select: none;
    user-select: none;
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim); flex: 0 0 auto;
    transition: background .25s;
  }
  #dot.live { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  header .spacer { margin-left: auto; }
  header button {
    font: inherit; color: var(--dim); background: none;
    border: 1px solid #23262b; border-radius: 6px;
    padding: 3px 9px; cursor: pointer;
  }
  header button:hover { color: var(--fg); border-color: #3a3f47; }
  #feed {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 28px 40px 45vh;
    scroll-behavior: smooth;
  }
  .line {
    margin: 0 0 26px;
    opacity: .34;
    transition: opacity .45s ease;
    max-width: 24ch_;
  }
  .line.recent { opacity: .62; }
  .line.latest { opacity: 1; }
  .line .time {
    display: block;
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--dim);
    margin-bottom: 5px;
    font-variant-numeric: tabular-nums;
  }
  .line .src {
    display: block;
    font-size: calc(var(--size) * .46);
    color: var(--dim);
    margin-top: 7px;
    font-style: italic;
  }
  /* The note is what a literal translation loses — idiom, sarcasm, a soft no.
     It has to be glanceable without competing with the words being spoken. */
  .line .note {
    display: block;
    font-size: calc(var(--size) * .44);
    line-height: 1.35;
    color: var(--accent);
    margin-top: 9px;
    padding-left: 11px;
    border-left: 2px solid var(--accent);
  }
  .line .note::before { content: "↳ "; opacity: .65; }
  .line.err .text { color: var(--warn); }
  #empty { color: var(--dim); font-size: 17px; padding: 8px 40px; }
  body.hide-src .src { display: none; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #fbfbfc; --fg: #14161a; --dim: #6b7079; }
    :root:not([data-theme="dark"]) header { background: #f1f2f4; border-bottom-color: #e2e4e8; }
  }
</style>
</head>
<body class="hide-src">
<header>
  <span id="dot"></span>
  <span id="status">connecting…</span>
  <span class="spacer"></span>
  <button id="srcBtn">show original</button>
  <button id="smaller">A−</button>
  <button id="bigger">A+</button>
</header>
<div id="feed"><div id="empty">Waiting for speech… start talking in the meeting.</div></div>

<script>
const feed = document.getElementById('feed');
const dot = document.getElementById('dot');
const status = document.getElementById('status');
const empty = document.getElementById('empty');
let size = 34, pinned = true;

// Auto-scroll only while the reader is at the bottom. If they scroll up to
// re-read something, new lines must not yank the view away from them.
feed.addEventListener('scroll', () => {
  pinned = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
});

function setSize(px) {
  size = Math.min(72, Math.max(18, px));
  document.documentElement.style.setProperty('--size', size + 'px');
  try { localStorage.setItem('mt.size', String(size)); } catch (e) {}
}
try {
  const s = localStorage.getItem('mt.size');
  if (s) setSize(parseInt(s, 10));
} catch (e) {}

document.getElementById('bigger').onclick = () => setSize(size + 4);
document.getElementById('smaller').onclick = () => setSize(size - 4);
document.getElementById('srcBtn').onclick = (e) => {
  document.body.classList.toggle('hide-src');
  e.target.textContent = document.body.classList.contains('hide-src')
    ? 'show original' : 'hide original';
};

fetch('/config').then(r => r.json()).then(c => {
  status.textContent = 'live → ' + c.target;
}).catch(() => {});

function add(seg) {
  if (empty) empty.remove();
  document.querySelectorAll('.line.latest').forEach(el => {
    el.classList.remove('latest');
    el.classList.add('recent');
  });
  document.querySelectorAll('.line.recent').forEach((el, i, all) => {
    if (i < all.length - 2) el.classList.remove('recent');
  });
  const div = document.createElement('div');
  div.className = 'line latest' + (seg.error ? ' err' : '');
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = seg.t + (seg.error ? '  · ' + seg.error : '');
  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = seg.text;
  const src = document.createElement('span');
  src.className = 'src';
  src.textContent = seg.source;
  div.append(time, text, src);
  if (seg.note) {
    const note = document.createElement('span');
    note.className = 'note';
    note.textContent = seg.note;
    div.appendChild(note);
  }
  feed.appendChild(div);
  if (pinned) feed.scrollTop = feed.scrollHeight;
}

const es = new EventSource('/stream');
es.onopen = () => { dot.classList.add('live'); };
es.onerror = () => { dot.classList.remove('live'); status.textContent = 'reconnecting…'; };
es.onmessage = (e) => {
  dot.classList.add('live');
  try { add(JSON.parse(e.data)); } catch (err) {}
};
</script>
</body>
</html>
